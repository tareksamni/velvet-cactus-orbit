  minSize: 1
  maxSize: 1
  subnets:
    - private-eu-west-1b
  image: ami-0c0d3776ef525d5dd
  rootVolumeType: gp3
  rootVolumeSize: 64
  rootVolumeEncryption: true
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  nodeLabels:
    kops.k8s.io/instancegroup: control-plane-eu-west-1b
    lifecycle: OnDemand
  cloudLabels:
    Project: csv-app
    lifecycle: OnDemand
---
