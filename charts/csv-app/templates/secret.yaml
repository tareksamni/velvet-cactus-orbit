{{/*
Static S3 credentials, only when there is no existingSecret and no IRSA.

In AWS the right answer is IRSA: annotate the ServiceAccount with a role ARN
and the pod gets short-lived credentials with no secret material in the cluster
at all. This Secret exists for the local MinIO demo and for environments that
genuinely have no OIDC provider.
*/}}
{{- if and (not .Values.s3.existingSecret) .Values.s3.accessKeyId .Values.s3.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csv-app.fullname" . }}
  labels:
    {{- include "csv-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_S3_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  APP_S3_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
  # boto3 also reads the standard names; setting both keeps any AWS SDK happy.
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
{{- end }}
