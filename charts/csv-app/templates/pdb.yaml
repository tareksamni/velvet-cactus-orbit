{{/*
Keeps at least one pod serving during voluntary disruption — node drains,
cluster upgrades, and Cluster Autoscaler scale-down, which drains nodes it
wants to remove. Without this, the autoscaler can briefly take the service to
zero on a small deployment.
*/}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "csv-app.fullname" . }}
  labels:
    {{- include "csv-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "csv-app.selectorLabels" . | nindent 6 }}
{{- end }}
