{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csv-app.serviceAccountName" . }}
  labels:
    {{- include "csv-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # In AWS this carries the IRSA role ARN, which is how the pod gets S3
    # access with no static credentials anywhere in the cluster.
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never calls the Kubernetes API, so it has no use for a token.
automountServiceAccountToken: false
{{- end }}
