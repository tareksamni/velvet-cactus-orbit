apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csv-app.fullname" . }}
  labels:
    {{- include "csv-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted entirely when the HPA is on, otherwise every `helm upgrade` would
  # reset the replica count the HPA has chosen.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "csv-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pods when app config or nginx.conf changes; without this a
        # ConfigMap edit is silently ignored by the running containers.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "csv-app.hasStaticCredentials" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "csv-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "csv-app.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30

      # -------------------------------------------------------------------
      # Shared storage, the "not NFS" requirement.
      #
      # The static assets ship inside the application image. This init
      # container copies them into an emptyDir that both the app and the nginx
      # sidecar mount read-only, so nginx can serve files it does not itself
      # contain. Pod-scoped, no CSI driver, no storage class, no NFS.
      # -------------------------------------------------------------------
      initContainers:
        - name: static-init
          image: {{ include "csv-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp -R /app/static/. {{ .Values.sharedStatic.mountPath }}/
              echo "published $(find {{ .Values.sharedStatic.mountPath }} -type f | wc -l) static file(s) to the shared volume"
          volumeMounts:
            - name: shared-static
              mountPath: {{ .Values.sharedStatic.mountPath }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

      containers:
        # -----------------------------------------------------------------
        # Application
        # -----------------------------------------------------------------
        - name: app
          image: {{ include "csv-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - uvicorn
            - main:app
            - --host=0.0.0.0
            - --port={{ .Values.app.port }}
            - --workers={{ .Values.app.workers }}
            - --no-server-header
          ports:
            - name: http-app
              containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: {{ include "csv-app.fullname" . }}
            {{- if include "csv-app.hasStaticCredentials" . }}
            - secretRef:
                name: {{ include "csv-app.secretName" . }}
            {{- end }}
          livenessProbe:
            # Liveness deliberately does not touch object storage: an S3
            # outage must not restart otherwise-healthy pods.
            httpGet:
              path: /healthz
              port: http-app
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Readiness does check storage, so a pod that cannot serve uploads
            # is pulled from the Service endpoints instead of erroring.
            httpGet:
              path: /readyz
              port: http-app
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http-app
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: shared-static
              mountPath: {{ .Values.sharedStatic.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

        # -----------------------------------------------------------------
        # Nginx sidecar — same pod, per the case-study requirement.
        # -----------------------------------------------------------------
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: shared-static
              mountPath: {{ .Values.sharedStatic.mountPath }}
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}

      volumes:
        # The shared storage itself. emptyDir is pod-scoped: created with the
        # pod, gone with it, shared by every container in it.
        - name: shared-static
          emptyDir:
            sizeLimit: {{ .Values.sharedStatic.sizeLimit }}
        - name: nginx-config
          configMap:
            name: {{ include "csv-app.fullname" . }}
            items:
              - key: nginx.conf
                path: nginx.conf
        # Both containers run with a read-only root filesystem, so anything
        # that needs to write gets an explicit writable mount.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
