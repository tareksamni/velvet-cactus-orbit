# ---------------------------------------------------------------------------
# Production on the kops cluster (never applied — see ASSUMPTIONS.md).
#
# Same templates as dev; only these values differ.
# ---------------------------------------------------------------------------

replicaCount: 3

image:
  # Published by .github/workflows/docker.yml on every push to main.
  repository: ghcr.io/tareksamni/csv-app
  # The released tag, published by .github/workflows/docker.yml. CI can override
  # this with an immutable sha-<short> tag for a specific deploy — "latest"
  # moves, which makes a rollback ambiguous, so it is deliberately not used.
  tag: "v1.1.0"
  pullPolicy: IfNotPresent

# The GHCR package is private until made public. A private package needs a pull
# secret here (a PAT with read:packages); a public one needs nothing.
imagePullSecrets: []

app:
  environment: prod
  logLevel: INFO
  workers: 4
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 768Mi

nginx:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

service:
  type: ClusterIP

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: csv-app.example.com
      paths:
        - path: /
          pathType: Prefix

# Real S3. No endpoint override, no static credentials — the pod authenticates
# with IRSA via the ServiceAccount annotation below, so there is no secret
# material in the cluster at all.
s3:
  bucket: csv-uploads-prod          # must be globally unique; set per account
  prefix: uploads
  region: eu-west-1
  endpointUrl: ""
  forcePathStyle: false
  accessKeyId: ""
  secretAccessKey: ""

serviceAccount:
  create: true
  annotations:
    # Terraform (infra/terraform/iam.tf) outputs this role ARN.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/csv-app-s3

minio:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2
