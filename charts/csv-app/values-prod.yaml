# ---------------------------------------------------------------------------
# Production on the kops cluster (never applied — see ASSUMPTIONS.md).
#
# Same templates as dev; only these values differ.
# ---------------------------------------------------------------------------

replicaCount: 3

image:
  repository: ghcr.io/OWNER/csv-app   # set by CI to the built image
  tag: ""                             # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

app:
  environment: prod
  logLevel: INFO
  workers: 4
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 768Mi

nginx:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

service:
  type: ClusterIP

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: csv-app.example.com
      paths:
        - path: /
          pathType: Prefix

# Real S3. No endpoint override, no static credentials — the pod authenticates
# with IRSA via the ServiceAccount annotation below, so there is no secret
# material in the cluster at all.
s3:
  bucket: csv-uploads-prod          # must be globally unique; set per account
  prefix: uploads
  region: eu-west-1
  endpointUrl: ""
  forcePathStyle: false
  accessKeyId: ""
  secretAccessKey: ""

serviceAccount:
  create: true
  annotations:
    # Terraform (infra/terraform/iam.tf) outputs this role ARN.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/csv-app-s3

minio:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2
