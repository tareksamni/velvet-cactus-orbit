---
# Drive the Helm release using the configuration app_config just rendered.

- name: Ensure the target namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace }}"
    state: present

- name: Deploy the Helm release
  kubernetes.core.helm:
    name: "{{ release_name }}"
    chart_ref: "{{ chart_path }}"
    release_namespace: "{{ namespace }}"
    create_namespace: false
    # Ordering matters: the chart defaults come first, then the environment
    # values file, then Ansible's generated overlay last so it wins.
    values_files:
      - "{{ chart_path }}/{{ values_file }}"
      - "{{ generated_values }}"
    wait: "{{ helm_wait }}"
    wait_timeout: "{{ helm_timeout }}"
    # Roll back automatically if the release does not become healthy, rather
    # than leaving a half-applied deployment behind.
    atomic: "{{ helm_atomic }}"
  register: helm_result

- name: Wait for the deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ release_name }}"
    namespace: "{{ namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Report the release state
  ansible.builtin.debug:
    msg: >-
      Release '{{ release_name }}' is {{ helm_result.status.status | default('deployed') }}
      in namespace '{{ namespace }}' (revision
      {{ helm_result.status.revision | default('n/a') }}).
