---
# ---------------------------------------------------------------------------
# Deploy the application to a Kubernetes cluster.
#
#   ansible-playbook site.yml -e env=dev
#   ansible-playbook site.yml -e env=prod
#
# This is cluster configuration management, not server-fleet management: kops
# owns the node lifecycle, so there is no fleet to configure. Ansible's job here
# is to own APPLICATION CONFIGURATION (group_vars/) and render it into the Helm
# release. Everything runs locally against the current kubeconfig.
# ---------------------------------------------------------------------------

- name: Deploy csv-app
  hosts: "{{ env | default('dev') }}"
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Fail early on an unknown environment
      ansible.builtin.assert:
        that:
          - env | default('dev') in ['dev', 'prod']
        fail_msg: "env must be 'dev' or 'prod' (got '{{ env | default('dev') }}')"
        quiet: true

    - name: Announce the target
      ansible.builtin.debug:
        msg: "Deploying '{{ release_name }}' to environment '{{ env_name }}' in namespace '{{ k8s_namespace }}'"

  roles:
    # Renders application config -> build/values.generated.yaml
    #
    # Tagged so the render can run on its own:
    #   ansible-playbook site.yml -e env=dev --tags config
    #
    # DevSpace uses exactly that, because it drives Helm itself but must still
    # deploy the SAME configuration Ansible produces — otherwise the dev loop
    # silently runs on the chart's fallback nginx config instead of this one.
    - role: app_config
      tags: [config]
    # Applies it via Helm
    - role: k8s_deploy
      tags: [deploy]
