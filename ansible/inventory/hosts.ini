# ---------------------------------------------------------------------------
# This is cluster configuration management, not server-fleet management.
#
# kops owns the lifecycle of the actual nodes, so there is no fleet of hosts for
# Ansible to configure. What Ansible owns here is APPLICATION CONFIGURATION:
# it renders the app's settings and the nginx config, then drives the Helm
# release. Everything therefore runs locally against the current kubeconfig.
# ---------------------------------------------------------------------------

[dev]
localhost ansible_connection=local

[prod]
localhost ansible_connection=local

[all:vars]
ansible_python_interpreter="{{ ansible_playbook_python }}"
