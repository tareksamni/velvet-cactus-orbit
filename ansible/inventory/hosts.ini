# ---------------------------------------------------------------------------
# This is cluster configuration management, not server-fleet management.
#
# kops owns the lifecycle of the actual nodes, so there is no fleet of hosts for
# Ansible to configure. What Ansible owns here is APPLICATION CONFIGURATION:
# it renders the app's settings and the nginx config, then drives the Helm
# release. Everything therefore runs locally against the current kubeconfig.
#
# Each environment gets a DISTINCT host name, even though both connect locally.
# A single host listed in both groups would inherit BOTH group_vars files —
# so `-e env=dev` would still pick up prod's values, silently deploying the
# wrong configuration.
# ---------------------------------------------------------------------------

[dev]
dev-cluster ansible_connection=local

[prod]
prod-cluster ansible_connection=local

[all:vars]
ansible_python_interpreter="{{ ansible_playbook_python }}"
