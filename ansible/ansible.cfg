[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
# The standalone `yaml` callback plugin lives in community.general, which this
# project does not otherwise need. ansible-core's built-in result_format gives
# the same readable output with no extra collection.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = ini
