---
name: Docker image

# Build the application image, scan it, and push it to the registry.
#
# Registry: GHCR by default, authenticated with the built-in GITHUB_TOKEN, so
# this works in a fresh clone or fork with no secrets to configure. The case
# study suggests Docker Hub; that is supported below but commented out because
# it needs credentials this repository does not have.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/docker.yml"
  # A vulnerability is published against code that has not changed. Without a
  # schedule the image is only ever scanned when someone touches app/, so a CVE
  # disclosed the day after a release goes unnoticed indefinitely. The weekly
  # rebuild also picks up base-image OS patches, which the application's own
  # requirements say nothing about.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # The application name, not the repository name — the published image is
  # ghcr.io/<owner>/csv-app, which is what charts/csv-app/values-prod.yaml and
  # ansible/group_vars/prod.yml reference.
  APP_NAME: csv-app

jobs:
  build:
    name: Build, scan and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write        # push to GHCR
      security-events: write # upload the Trivy SARIF report

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR rejects any uppercase character in a repository path, and GitHub
      # usernames and org names are free to contain them. Lowercasing the owner
      # here avoids a push failure that only shows up for some accounts.
      - name: Resolve the image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=${REGISTRY}/${OWNER,,}/${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.ref }}
          # image.source is what links the published package to this repository
          # in the GitHub UI, and what makes the package inherit the repo's
          # visibility rules. metadata-action sets it, but being explicit means
          # it survives someone trimming the defaults later.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ env.APP_NAME }}
            org.opencontainers.image.description=Parses stock-on-hand CSV exports and archives them to S3
            org.opencontainers.image.licenses=NONE
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            # The semver patterns below only fire for a fully-formed semver
            # tag. Pushing `v1.1` skips ALL of them — two components is not
            # valid semver — and the release would publish nothing but the sha
            # tag. This line is the catch-all: whatever the git tag says
            # becomes an image tag verbatim.
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # ---------------------------------------------------------------
      # Build once to a local image, scan it, and only push if it passes.
      # Scanning after the push would mean shipping the vulnerability first.
      # ---------------------------------------------------------------
      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          load: true
          push: false
          tags: csv-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------
      # Scanned twice on purpose, and the order matters.
      #
      # The first pass writes SARIF and never fails, so findings always reach
      # the Security tab — including on the run that is about to go red. A
      # single failing pass would leave the evidence only in a build log that
      # ages out.
      #
      # On the pinned version: v0.29.0 referenced aquasecurity/setup-trivy@v0.2.2
      # internally, and that tag was deleted upstream, so the action stopped
      # resolving. Pinning a SHA protects against the action's own code changing
      # under us, but not against a reference it makes BY TAG to another action.
      # Dependabot now watches these (see .github/dependabot.yml).
      # ---------------------------------------------------------------
      - name: Scan for vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csv-app:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Second pass is the gate. The vulnerability database is cached from the
      # first, so this costs seconds rather than a second full download.
      - name: Scan for vulnerabilities (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csv-app:scan
          format: table
          exit-code: "1"          # fail the build
          severity: HIGH,CRITICAL
          # Nothing to do about a vulnerability with no patch available — it
          # would block every build with no action a developer could take.
          # These still show up in the SARIF report above.
          ignore-unfixed: true

      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: csv-app:scan
          artifact-name: csv-app-sbom.spdx.json

      # Pull requests build and scan but never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub alternative, per the case study's suggestion. Needs
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
      #
      # - name: Log in to Docker Hub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # This is a multi-platform build, so the labels above land on the
          # per-architecture manifests rather than on the OCI index. GitHub
          # reads the INDEX to describe and link the package, so without
          # annotations the GHCR page shows no description and no repo link.
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull with:"
            echo '```'
            echo "docker pull ${{ steps.image.outputs.ref }}:latest"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Pull request: built and scanned, not pushed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
