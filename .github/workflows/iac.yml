---
name: Infrastructure as Code

# Validate the Helm chart, Terraform, Ansible, YAML and shell scripts.
#
# Note what is NOT here: `terraform plan` or `apply`. There is no AWS account
# bound to this repository, so the Terraform is validated statically only.
# See ADR-0003 and infra/terraform/README.md.
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "infra/**"
      - "ansible/**"
      - "scripts/**"
      - ".github/workflows/iac.yml"
  pull_request:
    paths:
      - "charts/**"
      - "infra/**"
      - "ansible/**"
      - "scripts/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint
        run: |
          helm lint charts/csv-app -f charts/csv-app/values-dev.yaml
          helm lint charts/csv-app -f charts/csv-app/values-prod.yaml

      # Both environments must render and pass schema validation. This is what
      # proves the chart genuinely serves multiple environments rather than
      # only ever being exercised with the dev values.
      - name: Render and validate every environment
        run: |
          for env in dev prod; do
            echo "::group::$env"
            helm template csv-app charts/csv-app -f "charts/csv-app/values-$env.yaml" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 -
            echo "::endgroup::"
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.3

      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      # -backend=false is what makes this work with no AWS account and no
      # state bucket: it type-checks the configuration without contacting AWS.
      - name: Init and validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate -no-color

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.54.0

      - name: tflint
        run: |
          tflint --init
          tflint --chdir=infra/terraform --format compact

      - name: Checkov policy scan
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          soft_fail: false

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check both environments
        working-directory: ansible
        run: |
          ansible-playbook site.yml --syntax-check -e env=dev
          ansible-playbook site.yml --syntax-check -e env=prod

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --profile production || ansible-lint

  static:
    name: YAML and shell
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: yamllint
        run: |
          pip install yamllint
          # Helm templates are Go templates, not YAML, so they are excluded.
          yamllint -c .yamllint.yml ansible/ infra/kops/ .github/

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x scripts/*.sh scripts/lib/*.sh infra/kops/*.sh
