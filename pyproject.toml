# Tooling configuration for the Python application.
# Kept at the repo root so `ruff`, `mypy` and `pytest` behave identically
# whether they are run by a developer, by the Makefile, or by CI.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008", # FastAPI's Depends()/File() in defaults is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
files = ["app"]
strict = true
warn_unused_configs = true
# Templates and third-party stubs we do not control.
[[tool.mypy.overrides]]
module = ["moto.*", "botocore.*"]
ignore_missing_imports = true

# No override relaxing the test files: app/tests has no __init__.py, so mypy
# sees them as top-level modules ("conftest", "test_api", ...) and the old
# `tests.*` pattern never matched. mypy 2.x reports such a section as unused,
# which is how it surfaced. The tests pass under strict anyway, so the honest
# fix is to drop the exemption rather than rewrite it.

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
